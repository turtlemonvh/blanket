# Build the reproducible toolchain image (Dockerfile at the repo root) and
# load it into the local docker daemon as blanket-dev:latest, so the
# `make docker-*` targets can run against it.
#
# Extracted as a composite action because ci.yml now fans the test surfaces
# out into one job each (turtlemonvh/blanket#155), and every one of them
# needs this same preamble. Keeping it in one file means a cache-strategy
# change or an action version bump is a single edit rather than six.
#
# release.yml uses it too, so "how blanket-dev:latest gets built" has exactly
# one definition in the repo. That matters ahead of #53 (publishing the image
# to GHCR): switching the docker jobs from building to pulling should be an
# edit to this file, not the same edit repeated across two workflows with an
# opportunity to diverge each time.
#
# The action SHAs below are pinned the same way the workflows pin theirs
# (see .github/dependabot.yml and the supply-chain rationale in its header).
# The warning this comment used to carry -- that `directory: "/"` would not
# reach these pins -- turned out to be exactly right: Dependabot closed #174
# with "Looks like docker/build-push-action is no longer a dependency" the
# moment #160 moved that pin here. dependabot.yml now lists
# `/.github/actions/*` alongside `/`, so this file is covered; adding a new
# composite action needs no further config change.
name: Build toolchain image
description: Build blanket-dev:latest from the GHA layer cache and load it into the docker daemon.

inputs:
  cache-to:
    description: >
      buildx cache export spec. Empty (the default) means read-only: pull
      layers from the cache but publish nothing back. Exactly one job per
      workflow run should pass a real value -- the fanned-out jobs all build
      the same image at the same time, so having each of them export mode=max
      would upload the same layers N times over for no benefit.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Buildx is required for the gha cache backend used below.
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # Cold builds take ~5m; cached builds settle to ~60s (mean 65s, p50 61s,
    # measured over 100 builds while investigating #155). mode=max on the
    # writer exports every layer for maximum hit rate -- fits inside GHA's
    # 10GB per-repo cache budget today.
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: blanket-dev:latest
        load: true
        cache-from: type=gha
        cache-to: ${{ inputs.cache-to }}
