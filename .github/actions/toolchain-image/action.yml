# Build the reproducible toolchain image (Dockerfile at the repo root) and
# either load it into the local docker daemon as blanket-dev:latest, so the
# `make docker-*` targets can run against it, or push it to GHCR.
#
# Extracted as a composite action because ci.yml now fans the test surfaces
# out into one job each (turtlemonvh/blanket#155), and every one of them
# needs this same preamble. Keeping it in one file means a cache-strategy
# change or an action version bump is a single edit rather than six.
#
# release.yml uses it too, so "how blanket-dev:latest gets here" has exactly
# one definition in the repo. That is what made #53 cheap: switching every
# docker job from building to pulling was an edit to this one file, and
# release.yml inherited the fast path without being touched.
#
# The action SHAs below are pinned the same way the workflows pin theirs
# (see .github/dependabot.yml and the supply-chain rationale in its header).
# The warning this comment used to carry -- that `directory: "/"` would not
# reach these pins -- turned out to be exactly right: Dependabot closed #174
# with "Looks like docker/build-push-action is no longer a dependency" the
# moment #160 moved that pin here. dependabot.yml now lists
# `/.github/actions/*` alongside `/`, so this file is covered; adding a new
# composite action needs no further config change.
name: Build toolchain image
description: Get blanket-dev:latest into the docker daemon -- pulled from GHCR when the content tag hits, built from the GHA layer cache when it misses -- or push it to GHCR.

inputs:
  cache-to:
    description: >
      buildx cache export spec. Empty (the default) means read-only: pull
      layers from the cache but publish nothing back. Exactly one job per
      workflow run should pass a real value -- the fanned-out jobs all build
      the same image at the same time, so having each of them export mode=max
      would upload the same layers N times over for no benefit.
    required: false
    default: ''
  push:
    description: >
      'true' publishes to GHCR under the content tag plus a moving `master`
      tag, instead of loading into the local daemon. Only
      .github/workflows/toolchain-image.yml passes this, and only on master:
      a pushing job produces no local blanket-dev:latest and so cannot run
      any `make docker-*` target. The caller is responsible for having
      logged in to ghcr.io first.
    required: false
    default: 'false'
  image:
    description: GHCR repository to push to. Only read when push is 'true'.
    required: false
    default: ghcr.io/turtlemonvh/blanket-dev

outputs:
  tag:
    description: The content tag for this image, from scripts/toolchain-hash.sh.
    value: ${{ steps.tag.outputs.tag }}

runs:
  using: composite
  steps:
    # One definition of the tag, shared by this action, the push workflow and
    # the Makefile's docker-pull -- see the script's header for why this is a
    # script rather than hashFiles().
    - name: Compute toolchain tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        tag="$("$GITHUB_WORKSPACE/scripts/toolchain-hash.sh")"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

        # Echoed as well as written to $GITHUB_OUTPUT so the value is
        # visible in the job log. That is the one place you can check that
        # CI and a local `scripts/toolchain-hash.sh` agree -- and a silent
        # disagreement between them is the failure mode this whole scheme
        # is built to avoid.
        echo "toolchain tag: $tag"

        # A failure here is deliberately fatal rather than a fallback to
        # building: the script only fails when its INPUTS list has drifted
        # from the Dockerfile, and continuing would publish or pull a tag
        # that means something different than it claims.

    # The fast path (turtlemonvh/blanket#53 phase 3): if master already
    # published an image for exactly these inputs, pull it and skip the
    # build entirely.
    #
    # This step can never fail the job. No `set -e`, and the pull's exit
    # status is consumed by the `if` -- a miss, a cold registry, a package
    # that is still private, or GHCR being down all fall through to the
    # buildx build below, which is precisely what every job did before this
    # existed. The failure mode of the whole scheme is "as slow as
    # yesterday", never "red".
    #
    # Anonymous: the package is public, which is what the local `docker
    # pull` path in #53 needs, so there is no login step here. Only the
    # publishing workflow authenticates.
    - name: Pull the toolchain image from GHCR
      if: inputs.push != 'true'
      id: pull
      shell: bash
      run: |
        set -uo pipefail
        ref="${{ inputs.image }}:${{ steps.tag.outputs.tag }}"

        if docker pull --quiet "$ref"; then
          docker tag "$ref" blanket-dev:latest
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "pulled $ref -- skipping the build"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "no image published for $ref -- building it"
        fi

    # Buildx is required for the gha cache backend used below. Skipped on a
    # pull hit along with the build itself: setting it up costs a few
    # seconds and nothing downstream reads it when there is no build.
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      if: inputs.push == 'true' || steps.pull.outputs.hit != 'true'

    # Cold builds take ~5m; cached builds settle to ~60s (mean 65s, p50 61s,
    # measured over 100 builds while investigating #155). mode=max on the
    # writer exports every layer for maximum hit rate -- fits inside GHA's
    # 10GB per-repo cache budget today.
    - name: Build and load blanket-dev:latest
      if: inputs.push != 'true' && steps.pull.outputs.hit != 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: blanket-dev:latest
        load: true
        cache-from: type=gha
        cache-to: ${{ inputs.cache-to }}

    # The push path deliberately does not `load` as well. Loading costs a
    # full image export into dockerd (~8s) that nothing in the push workflow
    # would ever use, and buildx needs a non-default driver to do both in one
    # pass -- two exporters for one consumer is not worth the complexity.
    #
    # Two tags on one build: the content tag is what CI and `make docker-pull`
    # resolve to, and `master` is the "just give me something recent" fallback
    # for a developer whose local inputs don't match any pushed image.
    #
    # The opencontainers source label is what links the GHCR package to this
    # repository, which is what lets GITHUB_TOKEN manage it afterwards (the
    # version pruning in the push workflow) and what makes the package show
    # up on the repo page rather than floating loose under the user account.
    - name: Build and push to GHCR
      if: inputs.push == 'true'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        tags: |
          ${{ inputs.image }}:${{ steps.tag.outputs.tag }}
          ${{ inputs.image }}:master
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.description=blanket toolchain image (Go + Playwright), built from the repo Dockerfile
        push: true
        cache-from: type=gha
        cache-to: ${{ inputs.cache-to }}

    # blanket-dev:latest is now in the local daemon, pulled or built. Tell
    # every subsequent `make docker-*` in this job not to build it again
    # (turtlemonvh/blanket#53 phase 1). This matters more after phase 3
    # than before it: an unguarded rebuild over a pulled image would not
    # merely waste time, it would mean the tests never run in the pinned
    # artifact the tag promises.
    #
    # Without this the step above was pure waste: `docker-image` is an
    # unguarded `docker build` that every docker-* target depends on, so the
    # first `make docker-*` rebuilt the image with the default dockerd
    # builder -- zero layers CACHED, a different image id -- and the tests
    # ran in that rebuild rather than in the image this action just loaded.
    #
    # Skipped on the push path, where there is no local image to protect:
    # asserting the knob there would make the next `make docker-*` fail its
    # `docker image inspect` guard instead of building, which is the correct
    # failure but an unhelpful one.
    #
    # $GITHUB_ENV, not a step output, because the consumer is `make` invoked
    # from an arbitrary later step in the job, not a step that could read an
    # output binding.
    - name: Skip the redundant image rebuild in make
      if: inputs.push != 'true'
      shell: bash
      run: echo "BLANKET_SKIP_IMAGE_BUILD=1" >> "$GITHUB_ENV"
