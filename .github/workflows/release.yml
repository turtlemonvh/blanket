name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: blanket-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cross-compile, then generate SHA256SUMS over the binaries and the
      # offline bundle -- all three in the same toolchain image, so the
      # checksums cover exactly the files that get attached.
      #
      # `make docker-release` is `docker-build` plus `checksums bundle`, and
      # it is a target rather than three inline `run:` steps so a maintainer
      # can produce byte-identical artifacts locally before tagging. A
      # release artifact only CI can build is one nobody can check.
      - name: Cross-compile, checksum, and bundle
        run: make docker-release VERSION=${{ github.ref_name }}

      # SPDX JSON SBOM of the module graph actually linked into the
      # release binary (turtlemonvh/blanket#144, decisions on #131).
      # `file:` mode reads embedded Go build info straight out of the
      # binary rather than walking the source tree, so it lists exactly
      # what shipped -- no GitHub Actions pins, no tests/e2e npm
      # devDependencies, none of the noise a `dir:.` scan of the repo
      # would add. Read from blanket-linux-amd64 as the representative
      # binary: verified locally that golang.org/x/sys (the only module
      # imported from a Windows-only build-tagged file) is already part
      # of the linux binary's module graph via other paths, so the three
      # platform binaries don't actually diverge in practice.
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.24.2
        with:
          file: blanket-linux-amd64
          format: spdx-json
          output-file: blanket-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Pull the tag's own section out of CHANGELOG.md ("## v0.3.0" up to
      # the next "## " heading) so the release body is the notes written
      # for users, not just an auto-generated PR list. Fails loudly if the
      # tag has no matching section -- a release that ships without notes
      # should not ship silently (turtlemonvh/blanket#87).
      - name: Extract changelog section
        run: |
          VERSION="${{ github.ref_name }}"
          awk -v heading="## ${VERSION}" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## ${VERSION}' section found in CHANGELOG.md" >&2
            exit 1
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # body_path supplies the hand-written notes; generate_release_notes
          # still appends GitHub's auto-generated PR/contributor list below
          # them, so nothing from the default notes is lost.
          body_path: release-notes.md
          generate_release_notes: true
          # SHA256SUMS is what `blanket upgrade` verifies every download
          # against (turtlemonvh/blanket#23 phase 6); a release without it
          # cannot be auto-upgraded to. The bundle is the offline-install
          # artifact -- see docs/offline_install.md. The SBOM is a
          # separate asset and deliberately NOT folded into SHA256SUMS --
          # that file's contents stay exactly what scripts/bundle.sh
          # produces (turtlemonvh/blanket#144).
          files: |
            blanket-linux-amd64
            blanket-darwin-amd64
            blanket-windows-amd64.exe
            SHA256SUMS
            dist/blanket-bundle-*.tar.gz
            blanket-${{ github.ref_name }}.spdx.json
