name: CI

# Run on PRs targeting master and direct pushes to master. We intentionally
# do NOT trigger on every topic-branch push — that would burn minutes on
# commits that aren't yet up for review.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel an in-flight run for the same ref when a new commit lands (e.g. a
# reviewer pushes a fix-up). Saves minutes on rapid PR iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each test surface gets its own job (turtlemonvh/blanket#155). They used to
# be four sequential steps inside a single `test` job, on the rationale that
# "parallel jobs would each pay the image build" -- true, but that is an
# argument about billed minutes, and this repo is public, so GitHub-hosted
# standard runners are free and unmetered. What is actually scarce here is
# wall-clock latency on a PR, and four concurrent 60s image builds cost 60s
# of wall clock rather than 240s.
#
# Measured: the serial `test` job averaged 298s over the 7 master pushes
# preceding this change (range 231-406s); fanned out, the blocking path is
# ~215s. That is roughly -25 to -30%, not the halving a first reading of the
# step times suggests -- see the caveat below. #155 has the breakdown.
#
# One effect of the split is worth knowing about, because the step times
# otherwise invite the wrong conclusion: serially, the four targets shared a
# warm Go build cache through the blanket-dev-cache volume, so
# docker-test-smoke and docker-test-browser each ran `make linux` against an
# already-populated GOCACHE. Fanned out, every job gets its own runner and its
# own cold volume, and all of them recompile the same packages -- which very
# nearly cancelled the parallelism win.
#
# That is what ./.github/actions/go-build-cache exists to fix: GOCACHE moves
# onto a host path actions/cache carries between jobs and between runs.
# Measured locally, cold vs warm: docker-test 73s -> 38s, docker-test-smoke
# 75s -> 50s, docker-test-browser 82s -> 66s. Note the cache is populated by
# the *previous* run (the writer saves after its siblings have already
# started), so the first run after a go.mod/go.sum change sees no benefit.
#
# The second benefit is diagnostic: a red `browser` next to a green `unit`
# says what broke without opening a log, and one surface failing no longer
# hides the result of the three that would have run after it.
jobs:
  # ---------------------------------------------------------------------
  # Test surfaces. One job per `make docker-*` target, all in parallel.
  # ---------------------------------------------------------------------

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-image
      - name: gofmt
        run: make docker-check-fmt

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The one job that publishes layers back to the GHA cache. Every other
      # docker job in this workflow reads from it; see the composite action's
      # `cache-to` input for why exactly one writer.
      - uses: ./.github/actions/toolchain-image
        with:
          cache-to: type=gha,mode=max

      - uses: ./.github/actions/go-build-cache
        id: gocache

      - name: Go tests
        run: make docker-test GO_BUILD_CACHE="${{ steps.gocache.outputs.path }}"

      # The one job that publishes the build cache, for the same reason it is
      # the one that exports docker layers. `always()` so a failing test run
      # still leaves a warm cache behind -- the compile it did is valid work
      # regardless of whether the assertions passed.
      - uses: ./.github/actions/go-build-cache
        if: always()
        with:
          mode: save

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-image
      - uses: ./.github/actions/go-build-cache
        id: gocache
      # docker-test-smoke chains smoke + restart + migrate + restart-machine
      # + upgrade — all of them cross-process tests against the built binary.
      # See the Makefile for why each one cannot be a Go test.
      - name: Smoke test
        run: make docker-test-smoke GO_BUILD_CACHE="${{ steps.gocache.outputs.path }}"

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-image
      - uses: ./.github/actions/go-build-cache
        id: gocache
      - name: Browser tests
        run: make docker-test-browser GO_BUILD_CACHE="${{ steps.gocache.outputs.path }}"

      # Playwright's `html` reporter writes to tests/e2e/playwright-report/
      # by default (see tests/e2e/playwright.config.ts). Surface it as a
      # downloadable artifact so PR authors can debug without log-scrubbing.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Aggregate gate.
  # ---------------------------------------------------------------------

  # `test` is the only context in master's branch protection required-checks
  # list. Keeping a job by that name — now an aggregator over the four
  # surfaces above rather than the job that runs them — means the fan-out
  # needs no branch-protection edit, and there is no window in which master
  # is merging against a check that no longer reports.
  #
  # `if: always()` plus the explicit result comparison is load-bearing: a job
  # whose `needs` failed is *skipped*, and a skipped required check does not
  # block a merge. Without this the fan-out would quietly defeat the very
  # protection it is trying to preserve.
  test:
    name: test
    needs: [fmt, unit, smoke, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every test surface succeeded
        env:
          RESULTS: >-
            fmt=${{ needs.fmt.result }}
            unit=${{ needs.unit.result }}
            smoke=${{ needs.smoke.result }}
            browser=${{ needs.browser.result }}
        run: |
          echo "$RESULTS"
          failed=0
          for pair in $RESULTS; do
            case "${pair#*=}" in
              success) ;;
              *) echo "::error::${pair%%=*} did not succeed (${pair#*=})"; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "all test surfaces passed"

  # ---------------------------------------------------------------------
  # Supplementary jobs. Already parallel before the fan-out; unchanged
  # except for picking up the shared composite action.
  # ---------------------------------------------------------------------

  # Race detector over the packages listed in the Makefile's test-race
  # target (turtlemonvh/blanket#119). Not yet a required check:
  # continue-on-error so a red run is informational rather than blocking,
  # the same posture the `windows` job started with. Promote this to
  # required (drop continue-on-error, add to branch protection) once it's
  # been green for a week -- long enough to catch a flake pattern before
  # it starts blocking every PR.
  #
  # Note for whoever does that promotion: over the 36 runs sampled in #155
  # this job failed 11.1% of the time, the highest rate of any job, so the
  # "green for a week" bar has demonstrably not been met yet. See #169.
  race:
    name: race
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-image
      # Deliberately no go-build-cache here. `-race` compiles into a separate
      # GOCACHE namespace, and the only job that saves a cache (`unit`) builds
      # without it, so this job would download ~300MB of entries it cannot
      # use. Worth revisiting only if race gets its own saved cache.
      - name: Go tests (race detector)
        run: make docker-test-race

  # Native windows-latest job (issue #79). Unlike the docker jobs, this
  # doesn't use Docker (Docker/Playwright on Windows runners is out of scope
  # per the issue discussion) — it builds the binary directly with the Go
  # toolchain the runner provides, then runs the subset of the test suite
  # that actually exercises Windows-specific code: the packages with
  # _windows.go files (worker/, command/) plus lib/service (rendered
  # cross-platform, but the Windows Scheduled Task path only gets a real
  # Windows-host run here), and a small PowerShell smoke script covering
  # both native Windows executors (cmd, powershell). See CONTRIBUTORS.md's
  # CI section for what this job does and deliberately doesn't cover.
  #
  # Once the docker surfaces fanned out beneath it this became one of the
  # two candidates for the blocking path, and its `setup-go` step alone
  # averages 68s (peak 114s), which looks uncached. See #168.
  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned toolchain version straight out of go.mod (the
      # `toolchain` directive) rather than a hardcoded version here — see
      # CLAUDE.md's "three Go version pins must stay in sync" gotcha. This
      # intentionally isn't a fourth pin.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o blanket-windows-amd64.exe .

      # Only the packages with Windows-specific code paths: worker/ has
      # signal_windows.go + daemon_windows.go, command/ has
      # service_windows.go, lib/service renders the Scheduled Task
      # definition (and its paths_test.go has a %LOCALAPPDATA% branch that
      # only runs on windows), lib/proclive resolves pid liveness through
      # OpenProcess/GetProcessTimes (turtlemonvh/blanket#23 phase 3) and
      # this is the only job that can execute that file at all, and
      # lib/follow does its own file watching — Windows is the platform
      # blanket polls on (worker/tail_watch_windows.go), and its
      # follow_notify_test.go is `//go:build !windows` so what runs here
      # is exactly the polling path the product uses
      # (turtlemonvh/blanket#142). Not `go test ./...` — Docker- and
      # browser-dependent surfaces are covered by the Linux jobs.
      - name: Go tests (Windows-specific packages)
        run: go test -v -count=1 ./worker/... ./command/... ./lib/service/... ./lib/proclive/... ./lib/follow/...

      - name: Smoke test
        run: pwsh scripts/smoke.ps1 -Binary .\blanket-windows-amd64.exe

      # install.ps1's first-ever CI run (issue #79). Exercises it twice
      # against the binary just built (BINARY_PATH skips the release
      # download) with a scratch $PROFILE/home so it can't touch the
      # runner's real user profile, asserting the marked shell-integration
      # block in $PROFILE is idempotent — same property scripts/smoke.sh
      # already checks for install.sh's .bashrc block on Linux.
      - name: install.ps1 (offline, twice)
        run: |
          $ErrorActionPreference = "Stop"
          $scratchHome = Join-Path $env:RUNNER_TEMP "install-ps1-home"
          New-Item -ItemType Directory -Path $scratchHome -Force | Out-Null
          $env:LOCALAPPDATA = Join-Path $scratchHome "AppData\Local"
          $global:PROFILE = Join-Path $scratchHome "Profile.ps1"

          $env:BINARY_PATH = (Resolve-Path .\blanket-windows-amd64.exe).Path
          $env:INSTALL_SKILLS = "0"
          $env:INSTALL_AUTOSTART = "0"
          $env:INSTALL_SHELL_INTEGRATION = "1"

          & .\scripts\install.ps1
          & .\scripts\install.ps1

          if (-not (Test-Path $global:PROFILE)) {
            Write-Error "install.ps1: expected $global:PROFILE to exist after install"
            exit 1
          }
          $lines = Get-Content $global:PROFILE
          $markerCount = ($lines | Select-String -Pattern '^# >>> blanket >>>$').Count
          if ($markerCount -ne 1) {
            Write-Error "install.ps1: expected exactly one blanket marked block in `$PROFILE after two installs, got $markerCount"
            Get-Content $global:PROFILE | Write-Host
            exit 1
          }
          if (-not ($lines -match 'blanket.exe completion powershell')) {
            Write-Error "install.ps1: `$PROFILE missing PowerShell completion sourcing line"
            exit 1
          }
          Write-Host "install.ps1: OK (marked block present exactly once after two installs)"

  # Cross-compile only runs on master pushes. It catches darwin/windows-only
  # breakage at the tip of master without spending minutes on every PR (and
  # the linux build is exercised end-to-end by the jobs above).
  cross-compile:
    name: cross-compile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-image
      - name: Cross-compile linux/darwin/windows
        run: make docker-build
