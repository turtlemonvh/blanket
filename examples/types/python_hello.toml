# Shells out to python3 — a realistic "run a script from the repo"
# pattern. Shows an optional env var (NAME) with a default, so the task
# can be submitted with no environment at all.
#
# Requires python3 on $PATH; tag "runtime:python3" keeps it off workers
# that don't advertise that capability.

description = "Print a greeting via python3."

documentation = '''
Requires python3 on $PATH. Demonstrates an optional input with a
default (NAME) so the task can be submitted with no environment at all.
'''

tags = ["runtime:python3", "os:unix"]
timeout = 60

command = '''
python3 -c "print('hello, {{.NAME}}!')"
'''

executor = "bash"

  [[environment.default]]
  name = "NAME"
  value = "world"
