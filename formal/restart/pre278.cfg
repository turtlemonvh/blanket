\* TLC config: the code before turtlemonvh/blanket#278 (breaks four rules; drop all but one from INVARIANTS to get its trace -- -continue prints every violating trace, gigabytes of them). Same bounds as `check.py --nw 1 --max-procs 3`.
SPECIFICATION Spec
CONSTANTS
    NW = 1
    MaxProcs = 3
    MaxAttempts = 2
    MaxRestarts = 2
    MaxCrashes = 1
    MaxOps = 1
    SpawnCanFail = FALSE
    AllowAbort = TRUE
    FIXED = FALSE
INVARIANTS
    TypeOK
    NoLostWorker
    DebtPaid
    NoDuplicateWorker
    OperatorStopWins
    NoOldWorkerAfterUpgrade
\* The bounds make terminal states normal (every counter spent, the only
\* worker stopped by an operator); a run that stops is not a bug here.
CHECK_DEADLOCK FALSE
