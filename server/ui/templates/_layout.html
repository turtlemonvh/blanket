{{define "layout"}}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blanket · {{.Title}}</title>
    <link rel="stylesheet" href="/ui/static/app.css">
    <script src="/ui/static/htmx.min.js"></script>
    <script src="/ui/static/htmx-sse.js"></script>
    <!-- Closes SSE streams on pagehide / reopens on a bfcache restore. See
         server/ui/static/sse-lifecycle.js and issue #103. -->
    <script src="/ui/static/sse-lifecycle.js"></script>
    <!-- Shows #server-restart-banner on a `server-restarting` SSE event.
         See server/ui/static/sse-restart-banner.js and issue #23. -->
    <script src="/ui/static/sse-restart-banner.js"></script>
</head>
<body>
    <nav class="topbar">
        <span class="brand"><a href="/ui/">Blanket</a></span>
        <a href="/ui/">Tasks</a>
        <a href="/ui/upcoming">Upcoming</a>
        <a href="/ui/workers">Workers</a>
        <a href="/ui/task-types">Task Types</a>
        <a href="/ui/about">About</a>
        <span class="spacer"></span>
        <span class="muted">htmx scaffold</span>
    </nav>
    <!-- Raised by sse-restart-banner.js when a stream reports the server
         is draining for a shutdown/restart; hidden again on reconnect. -->
    <div id="server-restart-banner" class="flash-area" hidden>
        <div class="flash flash-restarting">The blanket server is restarting — live updates are paused and will resume automatically.</div>
    </div>
    <div id="flash-area" class="flash-area"
         hx-trigger="task-type-warnings from:body"
         hx-get="/ui/partials/task-type-warnings"
         hx-vals="js:{type: event.detail.type, scheduled: event.detail.scheduled || ''}"
         hx-swap="none"></div>
    <main>
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
