{{define "task-types-rows"}}
{{range $i, $tt := .TaskTypes}}
<tr>
    <th scope="row" class="cell-num">{{add $i 1}}</th>
    <td class="cell-id"><a class="card-link" href="/ui/task-types/{{$tt.Name}}">{{$tt.Name}}</a></td>
    <td class="muted">{{$tt.Description}}</td>
    <td data-label="tags">{{join $tt.Tags ", "}}</td>
    <td class="d-only">{{fmtTs $tt.LoadedTs}}</td>
    <td class="muted d-only">{{$tt.ConfigFile}}</td>
    <td class="muted d-only">{{$tt.VersionHash}}</td>
</tr>
{{else}}
<tr><td colspan="7" class="muted">No task types configured.</td></tr>
{{end}}
{{end}}
